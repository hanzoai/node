[workspace]
resolver = "2"
members = ["chain", "chain/steward", "daemon", "zap"]

# hanzo-mcp's in-process search engine pulls tgrep-core, which asks for a newer
# git rusqlite. hanzod's Dev store links libsqlite3-sys 0.30; a second SQLite
# cannot be linked into one binary, so resolve both to the same rusqlite.
[patch."https://github.com/rusqlite/rusqlite.git"]
rusqlite = "=0.32.1"

# CI runners have no credential for the private lux-rs repos. Public mirrors
# under luxfi hold the exact same tags and commits; resolve them there.
[patch."ssh://git@github.com/lux-rs/evm.git"]
lux-evm = { path = "vendor/lux-evm" }
[patch."https://github.com/lux-rs/evm.git"]
lux-evm = { path = "vendor/lux-evm" }

[workspace.package]
edition = "2021"
authors = ["Hanzo AI, Inc."]
repository = "https://github.com/hanzoai/node"
license-file = "LICENSE"

[profile.release]
lto = true
strip = true

[patch."https://github.com/luxfi/hanzod-node.git"]
lux-node = { path = "vendor/lux-node" }
