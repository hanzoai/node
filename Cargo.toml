[workspace]
# All hanzo-libs/* crates now live in `../net/` (github.com/hanzoai/hanzonet).
# This workspace consumes them as path-deps; they are no longer members.
members = [
  "hanzo-test-framework",  # Required by hanzo-node
  "hanzo-test-macro",      # Required by hanzo-node
  "hanzo-bin/hanzo-node",
  "hanzo-bin/hanzoai",
  # "hanzo-bin/hanzo-migrate", # Excluded: depends on hanzo-db which has feature-gated deps
]
resolver = "2"

[workspace.package]
version = "1.1.20"
edition = "2021"
authors = ["Nico Arqueros <nico@hanzo.ai>"]

[workspace.dependencies]
# All hanzonet/* crates resolve from crates.io now that the monorepo has been
# split into 36 focused repos under github.com/hanzonet/*. See
# https://github.com/hanzonet/network/blob/main/README.md for the map.
# The four `package = "hanzonet-*"` rename trick preserves consumer imports
# (`use hanzo_pqc::...` etc.) while the published crate has the hanzonet- prefix.
hanzo-agentic = "1.1.21"
hanzo-ai-format = "1.1.21"
hanzo-api = "1.1.13"
hanzo-brain = "0.1.0"
hanzo-compute = "1.1.21"
hanzo-config = { version = "1.1.21", package = "hanzonet-config" }
hanzo-consensus = "1.1.21"
hanzo-database = "1.1.13"
hanzo-db-sqlite = "1.1.13"
hanzo-did = { version = "1.1.21", package = "hanzonet-did" }
hanzo-embed = "1.1.13"
hanzo-fs = "1.1.21"
hanzo-hmm = "0.1.2"
hanzo-http-api = "1.1.21"
hanzo-identity = "1.1.13"
hanzo-job-queue-manager = "1.1.21"
hanzo-jobs = "1.1.13"
hanzo-l2 = "1.1.21"
hanzo-libp2p = "1.1.13"
hanzo-libp2p-relayer = "1.1.13"
hanzo-machine = "1.1.21"
hanzo-mcp = { version = "1.1.21", package = "hanzonet-mcp" }
hanzo-messages = "1.1.13"
hanzo-mining = "1.1.21"
hanzo-model-discovery = "1.1.13"
hanzo-models = "1.1.13"
hanzo-pqc = { version = "1.1.21", package = "hanzonet-pqc" }
hanzo-runner = "1.1.13"
hanzo-runtime = "1.1.13"
hanzo-runtime-tests = "0.1.2"
hanzo-tools = "1.1.21"
hanzo-tools-runner = "1.0.2"
hanzo-vm = "1.1.22"
hanzo-wasm = "0.1.2"
hanzo-wasm-runtime = "1.1.21"
hanzo-zap = "0.6.75"



rmcp = { version = "0.8" }
futures = "0.3.30"
keyphrases = "0.3.3"
tokio = { version = "1.36", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "fs",
  "io-util",
  "net",
  "sync",
  "time",
] }
tokio-util = "0.7.13"
bincode = "1.3.3"
log = "0.4.20"
chrono = "0.4"
serde_json = "1.0.117"
anyhow = "1.0.94"
blake3 = "1.2.0"
sha2 = "0.10"
serde = "1.0.219"
base64 = "0.22.0"
reqwest = "0.11.27"
regex = "1"
uuid = { version = "1.6.1" }
rand = "=0.8.5"
hex = "=0.4.3"
env_logger = "0.11.5"
async-trait = "0.1.74"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
tempfile = "3.19"
lazy_static = "1.5.0"
async-channel = "1.6.1"
csv = "1.1.6"
thiserror = "2.0.3"
dashmap = "5.5.3"
hpke = "0.12"
chacha20poly1305 = "0.10"
clap = "3.0.0-beta.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.25"
rusqlite = { version = "0.32.1", features = ["bundled"] }
os_path = "0.8.0"
utoipa = "4.2.3"
warp = "0.3.7"
once_cell = "1.21"
home = "0.5"
strip-ansi-escapes = "0.2"
tracing = "0.1.40"
serde_yaml = "0.9.34-deprecated"
tokio-tungstenite = "0.26.2"
rustls = "0.23.27"
# Native embedding support via hanzoai/engine (our mistral.rs fork)
# hanzo_engine = { git = "https://github.com/hanzoai/engine.git", default-features = false }
# candle-core = "0.8"
# candle-nn = "0.8"
# candle-transformers = "0.8"
# hf-hub = "0.3"
# tokenizers = "0.20"
dirs = "5.0"
libp2p = { version = "0.55.0", features = [
  "noise",
