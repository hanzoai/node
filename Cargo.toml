[package]
name = "hanzod"
version = "0.2.4"
edition = "2021"
description = "The Hanzo network node"
authors = ["Hanzo AI, Inc."]
repository = "https://github.com/hanzoai/node"
license-file = "LICENSE"
readme = "README.md"

[[bin]]
name = "hanzod"
path = "src/main.rs"

[dependencies]
# The node this one is: keys, the validator mesh, the EVM, the chain on disk,
# catch-up and JSON-RPC, at a tag. Two validators on one network resolve the same
# tag or they do not agree about what a block means.
lux-node = { git = "ssh://git@github.com/lux-rs/node.git", tag = "v0.2.2" }

[profile.release]
lto = true
strip = true
