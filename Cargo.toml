[workspace]
# All hanzo-libs/* crates now live in `../net/` (github.com/hanzoai/hanzonet).
# This workspace consumes them as path-deps; they are no longer members.
members = [
  "hanzo-test-framework",  # Required by hanzo-node
  "hanzo-test-macro",      # Required by hanzo-node
  "hanzo-bin/hanzo-node",
  "hanzo-bin/hanzoai",
  # "hanzo-bin/hanzo-migrate", # Excluded: depends on hanzo-db which has feature-gated deps
]
resolver = "2"

[workspace.package]
version = "1.1.20"
edition = "2021"
authors = ["Nico Arqueros <nico@hanzo.ai>"]

[workspace.dependencies]
hanzo-api = { path = "../net/hanzo-api", version = "1.1.12" }
hanzo-config = { path = "../net/hanzo-config", version = "1.1.21", package = "hanzonet-config" }
hanzo-database = { path = "../net/hanzo-database", version = "1.1.12" }
hanzo-db = { path = "../net/hanzo-db", version = "0.1.1" }
hanzo-db-sqlite = { path = "../net/hanzo-db-sqlite", version = "1.1.12" }
hanzo-did = { path = "../net/hanzo-did", version = "1.1.21", package = "hanzonet-did" }
hanzo-embed = { path = "../net/hanzo-embed", version = "1.1.12" }
hanzo-fs = { path = "../net/hanzo-fs" }
hanzo-hmm = { path = "../net/hanzo-hmm", version = "0.1.1" }
hanzo-http-api = { path = "../net/hanzo-http-api" }
hanzo-identity = { path = "../net/hanzo-identity", version = "1.1.12" }
hanzo-job-queue-manager = { path = "../net/hanzo-job-queue-manager" }
hanzo-jobs = { path = "../net/hanzo-jobs", version = "1.1.12" }
hanzo-kbs = { path = "../net/hanzo-kbs", version = "1.1.11" }
hanzo-l2 = { path = "../net/hanzo-l2", version = "1.1.19" }
hanzo-libp2p = { path = "../net/hanzo-libp2p", version = "1.1.12" }
hanzo-libp2p-relayer = { path = "../net/hanzo-libp2p-relayer", version = "1.1.12" }
hanzo-mcp = { path = "../net/hanzo-mcp", version = "1.1.21", package = "hanzonet-mcp" }
hanzo-messages = { path = "../net/hanzo-messages", version = "1.1.12" }
hanzo-mining = { path = "../net/hanzo-mining", version = "1.1.19" }
hanzo-consensus = { path = "../net/hanzo-consensus", version = "1.1.19" }
hanzo-compute = { path = "../net/hanzo-compute", version = "1.1.19" }
hanzo-ai-format = { path = "../net/hanzo-ai-format", version = "1.1.19" }
hanzo-model-discovery = { path = "../net/hanzo-model-discovery", version = "1.1.12" }
hanzo-models = { path = "../net/hanzo-models", version = "1.1.12" }
hanzo-pqc = { path = "../net/hanzo-pqc", version = "1.1.21", package = "hanzonet-pqc" }
hanzo-runner = { path = "../net/hanzo-runner", version = "1.1.12" }
hanzo-runtime = { path = "../net/hanzo-runtime", version = "1.1.12" }
hanzo-runtime-tests = { path = "../net/hanzo-runtime-tests", version = "0.1.1" }
hanzo-sheet = { path = "../net/hanzo-sheet", version = "0.1.1" }
# hanzo-simulation = { path = "../net/hanzo-simulation" }
hanzo-tests = { path = "../net/hanzo-tests", version = "0.1.1" }
hanzo-tools = { path = "../net/hanzo-tools" }
hanzo-tools-runner = { path = "../net/hanzo-tools-runner", version = "1.0.1" }
hanzo-wasm = { path = "../net/hanzo-wasm", version = "0.1.1" }
hanzo-vm = { path = "../net/hanzo-vm", version = "1.1.19" }
hanzo-machine = { path = "../net/hanzo-machine", version = "1.1.19" }
hanzo-wasm-runtime = { path = "../net/hanzo-wasm-runtime", version = "1.1.19" }
hanzo-zap = { path = "../net/hanzo-zap", version = "0.6.75" }



rmcp = { version = "0.8" }
futures = "0.3.30"
keyphrases = "0.3.3"
tokio = { version = "1.36", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "fs",
  "io-util",
  "net",
  "sync",
  "time",
] }
tokio-util = "0.7.13"
bincode = "1.3.3"
log = "0.4.20"
chrono = "0.4"
serde_json = "1.0.117"
anyhow = "1.0.94"
blake3 = "1.2.0"
sha2 = "0.10"
serde = "1.0.219"
base64 = "0.22.0"
reqwest = "0.11.27"
regex = "1"
