[workspace]
# Convergence (2026-06): this sync checkout uses the slimmed layout — the
# hanzo-libs/* cluster lives in the standalone `hanzonet` workspace and is
# consumed from crates.io (see [workspace.dependencies]). main's monorepo listed
# ~35 hanzo-libs path-members; this checkout only ships the two bins + their test
# crates as members. main's new node-side libs (hanzo-brain, hanzo-pqc) are
# present on disk under hanzo-libs/ but are NOT members here: nothing in this
# workspace consumes them, and hanzo-pqc pulls extra path-deps (lux-crypto, oqs)
# outside the slim graph. They belong to the hanzonet workspace; keep them out
# of node's members so `cargo` resolves the focused bin graph.
members = [
  "hanzo-test-framework",
  "hanzo-test-macro",
  "hanzo-bin/hanzo-node",
  # "hanzo-bin/hanzoai", # Excluded: pre-existing breakage (independent of the
  # engine 1.0.2 port). Its deps path to `../../../net/hanzo-{embed,messages,
  # model-discovery}`, which do not exist in this checkout or on net's main
  # (net is Python; only hanzo-zap is a Rust crate there). A broken member
  # blocks resolution of the whole workspace, so it is excluded until the net
  # Rust crates are published/vendored. Tracked separately from this port.
]
resolver = "2"

[workspace.package]
version = "1.1.20"
edition = "2021"
authors = ["Nico Arqueros <nico@hanzo.ai>"]

[workspace.dependencies]
# hanzo/* node libs (resolved from crates.io). hanzo-mcp is now published under
# its real name (1.1.21), so the former `package = "hanzonet-mcp"` rename trick
# has been dropped — `use hanzo_mcp::...` at call sites is unchanged.
#
# Version note (convergence 2026-06): the plan targets a unified 1.1.21 line.
# fs/http-api/job-queue-manager/mcp/tools are published at 1.1.21 and bumped.
# db-sqlite/embed/identity/libp2p-relayer/messages/model-discovery/runtime are
# only published up to 1.1.13 on crates.io, so they stay at 1.1.13 until a
# 1.1.21 of each is published from the zoo monorepo (see CONVERGENCE_PLAN B.4).
hanzo-db-sqlite = "1.1.13"
hanzo-embed = "1.1.13"
hanzo-fs = "1.1.21"
hanzo-http-api = "1.1.21"
hanzo-identity = "1.1.13"
hanzo-job-queue-manager = "1.1.21"
hanzo-libp2p-relayer = "1.1.13"
hanzo-mcp = "1.1.21"
hanzo-messages = "1.1.13"
hanzo-model-discovery = "1.1.13"
hanzo-runtime = "1.1.13"
hanzo-tools = "1.1.21"
hanzo-tools-runner = "1.0.2"
hanzo-zap = "0.6.75"

# hanzoai/engine — canonical inference + embedding engine (powers EVM AI
# precompiles 0x0201/0x0202 via runner::install_engine). Path dep for the
# sibling-checkout dev layout (node <- engine <- ml); the `version` pins the
# crates.io release for a published node. Engine is now 1.0.2 (was 0.6.0).
# NOTE: 1.0.2 is not yet on crates.io (only 0.6.0 is published; engine main is
# at 1.0.2). Publishing 1.0.2 is Part A of the plan — until then this resolves
# via the path dep only.
hanzo-engine = { version = "1.0.2", path = "../engine/hanzo-engine" }
# Convergence (2026-06, engine 0.6.0 -> 1.0.2 port): `install_engine` /
# `install_zen5_engines` build an owned `Arc<Hanzo>` via the server-core
# `HanzoForServerBuilder` (which wraps the 1.0.2 `HanzoBuilder` + Loader). The
# 0.6.0 process-wide engine registry was removed, so the node keeps its own
# handle (runner::ENGINE). Same path-dep/version layering as hanzo-engine.
hanzo-server-core = { version = "1.0.2", path = "../engine/hanzo-server-core", default-features = false }


