[package]
name = "hanzod-operator"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "hanzod — native Kubernetes operator that reconciles apps.hanzo.ai CRs (one kind: App, spec.role selects the profile) to Deployment+Service+Ingress; leaderless across clusters (ha/ZAP seam)"

[lib]
name = "hanzod_operator"
path = "src/lib.rs"

[[bin]]
name = "hanzod-operator"
path = "src/main.rs"

[dependencies]
kube = { workspace = true }
k8s-openapi = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
serde_yaml = { workspace = true }
