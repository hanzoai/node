[package]
name = "hanzod"
version = "0.5.0"
edition.workspace = true
description = "The unified Hanzo daemon: sole Desktop/Bot/Team backend, unified hanzo-gen harness (/v1/dev + /v1/agent/coding), tasks worker, k3s/cloud, chain, and inference"
authors.workspace = true
repository.workspace = true
license-file = "../LICENSE"

[lib]
name = "hanzod_ffi"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "hanzod"
path = "src/main.rs"

[features]
default = []
# Compile the Hanzo validator (`hanzo-chain` / `lux-node`) directly into the single `hanzod` binary.
embedded-chain = ["dep:hanzo-chain"]

[dependencies]
# Who the machine is: the CLI's identity store, shared by crate, not by copy.
hanzo-identity = { git = "https://github.com/hanzoai/cli", rev = "287bcbd78185b382a4561eabaccf620d7c05781f" }
# Canonical in-process agentic harness: MCP + hanzoskills + gateway/local routing + target runner.
hanzo-gen = { git = "https://github.com/hanzoai/gen", rev = "be1946c17b05d7beb97e9768345b5969455d67dc" }
# Native Rust Dev engine (HIP-1330): protocol, pure session core, and pure orchestrator decide rules.
dev-protocol = { git = "https://github.com/hanzoai/dev", rev = "9ea2907922e202a675b2b05ae2cb0515f19d84de" }
dev-core = { git = "https://github.com/hanzoai/dev", rev = "9ea2907922e202a675b2b05ae2cb0515f19d84de" }
dev-orchestrator = { git = "https://github.com/hanzoai/dev", rev = "9ea2907922e202a675b2b05ae2cb0515f19d84de" }
# Persistent event-sourced SQLite store for native Dev sessions, snapshots, and action ledger.
rusqlite = { version = "0.32", features = ["bundled"] }
# The /v1/chain route, opt-in custody of hanzo-chain (or embedded self-exec when `embedded-chain` is enabled).
steward = { path = "../chain/steward" }
hanzo-chain = { path = "../chain", optional = true }
# ZAP-HTTP frames and the router envelope.
zaphttp = { path = "../zap" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "process", "signal", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"
dirs = "5"
toml = "0.8"
jsonwebtoken = "9"
ureq = "2"
# The outbound WebTransport session to the cloud relay; aws-lc-rs carries the X25519MLKEM768 key exchange the edge pins.
wtransport = { version = "0.7", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tempfile = "3"
wtransport = { version = "0.7", default-features = false, features = ["aws-lc-rs", "self-signed", "dangerous-configuration"] }
