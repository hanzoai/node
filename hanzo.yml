# Canonical CI/CD config for hanzoai/node — the one file both the hanzoai/ci
# reusable (.hanzo/workflows/cicd.yml) and platform.hanzo.ai read.
#
# The repo ships one artifact: the hanzo-node binary, wrapped by docker/Dockerfile
# and pulled as ghcr.io/hanzoai/node. Nothing else builds it, so it is declared
# here and this is the only lane that publishes it.
#
# Crate publication to crates.io is a release action, not a gate, and lives in
# .hanzo/workflows/crates.yml.

images:
  - name: node
    context: .
    dockerfile: docker/Dockerfile
    repo: ghcr.io/hanzoai/node
    # `cargo build --locked --bin hanzo-node` inside the Dockerfile is the
    # compile proof for the artifact we actually deploy: it resolves the whole
    # workspace and links the binary the entrypoint runs.
    args:
      BUILD_TYPE: release

test:
  # hanzo-messages is the foundation crate — every other crate in the workspace
  # depends on its wire types, so a break here breaks everything downstream. It
  # is also the one suite that needs no cluster, no wallet and no network, which
  # is why the repo has always run it as the fast signal.
  - name: cargo test
    run: |
      set -e
      # .cargo/config.toml pins clang + lld on both Linux targets, because the
      # default linker runs the arm64 builds out of memory. The runner image
      # carries neither, so cargo dies on the first build script — proc-macro2 —
      # long before any test runs.
      command -v clang >/dev/null && command -v ld.lld >/dev/null || {
        sudo apt-get update && sudo apt-get install -y clang lld
      }
      cargo test -p hanzo-messages
