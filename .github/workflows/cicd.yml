name: CI/CD

# The caller, and deliberately nothing else: triggers plus the import. All real
# config is the repo-root hanzo.yml, which platform.hanzo.ai reads too.
#
# A queued job here reaches the GitHub App, which mints a runner for exactly
# that job on our own fleet. No job runs on a builder we do not own.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    secrets: inherit
    # hanzod ships for both architectures and neither is emulated. A runner
    # builds only what it is, so asking one for both is a refusal, correctly:
    # the emulated half is slow enough to be why a queue forms on the one node
    # that can serve it. delegate hands the build to the door on api.hanzo.ai,
    # which schedules one per architecture on a node of that architecture.
    with:
      mode: delegate
