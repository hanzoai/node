name: hanzod-operator image

# Build + publish ghcr.io/hanzoai/hanzod-operator (the apps.hanzo.ai operator).
#
# Gated on purpose: the image is deployed via the shadow→cutover runbook
# (universe/infra/k8s/operator-hanzod/LLM.md), not on every push. Trigger it with
# `workflow_dispatch` for the shadow build, or a release tag `v*` for a pinned
# semver. Runs on the native Hanzo ARC amd64 fleet — never a GitHub-hosted runner.

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build + push hanzod-operator
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version (workspace Cargo.toml)
        id: v
        shell: bash
        run: echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./hanzo-bin/hanzod-operator/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/hanzoai/hanzod-operator:${{ steps.v.outputs.version }}
            ghcr.io/hanzoai/hanzod-operator:${{ steps.v.outputs.version }}-${{ github.sha }}
            ghcr.io/hanzoai/hanzod-operator:latest
