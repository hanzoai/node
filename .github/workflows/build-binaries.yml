name: Build hanzo-node binaries

# Canonical native release build for hanzo-node.
#
# Every per-arch binary is built NATIVELY on the Hanzo self-hosted runner fleet
# (no cross-compile, no GitHub-hosted runners) and cosign-signed, via the reusable
# hanzoai/arc build-matrix. The signed native artifacts are then packaged (7z) and
# fanned out to the SAME downstream distribution channels as before — Cloudflare R2,
# the GitHub Release, and Docker Hub.
#
# Fleet runs-on mapping (per the canonical fleet):
#   linux-x64    -> ARC scale-set "hanzo-build-linux-amd64"
#   linux-arm64  -> ARC scale-set "hanzo-build-linux-arm64"   (NATIVE on spark; replaces the
#                                                     old `cross: true` cross-compile)
#   macos-arm64  -> ["self-hosted","macOS","ARM64"] (dbc)
#   windows-x64  -> ["self-hosted","Windows","X64"] (evo)
#
# ARC Linux runner images are minimal, so the rust toolchain + protobuf compiler are
# bootstrapped in-job (see the `build` command below). Once the toolchain-baked runner
# image lands (hanzoai/arc#39) the bootstrap block can be dropped.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# cosign keyless signing in the reusable workflow needs an OIDC token. `contents: read`
# is enough for the build matrix; the downstream release job requests its own token.
permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Native build + test + cosign signing on the fleet (reusable build-matrix).
  #    Produces, per platform, an uploaded artifact named after the platform that
  #    contains: the hanzo-node binary, the hanzo-tools-runner-resources tarball,
  #    and the cosign .sig/.pem for each.
  # ---------------------------------------------------------------------------
  build:
    name: Build (native + cosign)
    uses: hanzoai/arc/.github/workflows/build-matrix.yml@main
    permissions:
      id-token: write   # cosign keyless (Sigstore / GitHub OIDC)
      contents: read
    with:
      # runsOn: STRING = ARC scale-set name (containerized Linux), ARRAY = label set
      # for the standalone macOS/Windows hosts ARC can't host.
      platforms: >-
        [{"name":"x86_64-unknown-linux-gnu","runsOn":"hanzo-build-linux-amd64"},
         {"name":"aarch64-unknown-linux-gnu","runsOn":"hanzo-build-linux-arm64"},
         {"name":"aarch64-apple-darwin","runsOn":["self-hosted","macOS","ARM64"]},
         {"name":"x86_64-pc-windows-msvc","runsOn":["self-hosted","Windows","X64"]}]
      # Single native build command, runs in bash on every platform. It:
      #   1. bootstraps rust + protobuf (minimal ARC images; brew on macOS; no-op
      #      where already present, e.g. the baked image from arc#39),
      #   2. builds hanzo-node for the host's native target (NO --target, NO cross),
      #   3. stages the binary + the build.rs-produced hanzo-tools-runner-resources
      #      into dist/ as flat, signable files (resources tarred so symlinks/exec
      #      bits survive and cosign sign-blob has a single file to sign).
      build: |
        set -euo pipefail
        export AI_MODEL_CATALOG_BUILD=1

        is_windows=0
        case "${RUNNER_OS:-}" in
          Windows) is_windows=1 ;;
        esac

        # --- toolchain bootstrap (minimal ARC linux image; arc#39 will bake these) ---
        if ! command -v rustup >/dev/null 2>&1 && ! command -v cargo >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup show >/dev/null 2>&1 || true
        # rustfmt is needed by some build scripts in the workspace.
        rustup component add rustfmt >/dev/null 2>&1 || true

        if ! command -v protoc >/dev/null 2>&1; then
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              ${SUDO:-} apt-get update && ${SUDO:-} apt-get install -y protobuf-compiler clang lld pkg-config libssl-dev \
                || (apt-get update && apt-get install -y protobuf-compiler clang lld pkg-config libssl-dev) \
                || sudo apt-get install -y protobuf-compiler clang lld pkg-config libssl-dev
            fi
          elif [ "${RUNNER_OS:-}" = "macOS" ]; then
            brew install protobuf || true
          fi
        fi

        # Windows: rust-lld linker (matches the prior cross-free msvc config).
        if [ "$is_windows" = "1" ]; then
          mkdir -p .cargo
          printf '[target.x86_64-pc-windows-msvc]\nlinker = "rust-lld"\n' > .cargo/config.toml
        fi

        protoc --version || true
        rustc --version && cargo --version

        # --- native build (host target; no cross-compile) ---
        cargo build --release --bin hanzo-node

        # --- stage signable artifacts into dist/ ---
        rm -rf dist && mkdir -p dist
        if [ "$is_windows" = "1" ]; then BIN=hanzo-node.exe; else BIN=hanzo-node; fi
        cp "target/release/${BIN}" "dist/${BIN}"
        if [ -d target/release/hanzo-tools-runner-resources ]; then
          tar -C target/release -czf dist/hanzo-tools-runner-resources.tar.gz hanzo-tools-runner-resources
        fi
        ls -la dist
      # Build the whole thing under release; the dedicated CI workflows own unit tests,
      # and a release tag build should not be gated on the full test suite here.
      test: ''
      # dist/ holds only files (binary + resources tarball) so cosign sign-blob signs
      # each cleanly and the .sig/.pem land alongside for the packaging job to ship.
      artifacts: dist/*
      sign: true

  # ---------------------------------------------------------------------------
  # 2. Package the signed native artifacts (7z) and fan out to R2 + GH Release.
  #    Identical packaging + distribution as before, now consuming the SIGNED
  #    native binaries (and shipping their cosign .sig/.pem alongside).
  # ---------------------------------------------------------------------------
  package-and-release:
    name: Package + release (${{ matrix.arch }})
    needs: build
    # Arch-agnostic zip + upload. Kept on the native amd64 fleet runner (never a
    # GitHub-hosted runner) per the one-canonical-way goal.
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: write   # svenstaro/upload-release-action writes the GH Release
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - name: Download signed artifacts for ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist

      - name: Assemble bundle (binary + resources + cosign signatures)
        shell: bash
        env:
          EXTENSION: ${{ matrix.arch == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
        run: |
          set -euo pipefail
          mkdir -p files-to-r2
          # Binary (+ its cosign signature/cert).
          cp "dist/hanzo-node${EXTENSION}" files-to-r2/
          [ -f "dist/hanzo-node${EXTENSION}.sig" ] && cp "dist/hanzo-node${EXTENSION}.sig" files-to-r2/ || true
          [ -f "dist/hanzo-node${EXTENSION}.pem" ] && cp "dist/hanzo-node${EXTENSION}.pem" files-to-r2/ || true
          # Tools runner resources (+ its cosign signature/cert), restored to the
          # original on-disk layout the bundle has always shipped.
          if [ -f dist/hanzo-tools-runner-resources.tar.gz ]; then
            tar -C files-to-r2 -xzf dist/hanzo-tools-runner-resources.tar.gz
            [ -f dist/hanzo-tools-runner-resources.tar.gz.sig ] && cp dist/hanzo-tools-runner-resources.tar.gz.sig files-to-r2/ || true
            [ -f dist/hanzo-tools-runner-resources.tar.gz.pem ] && cp dist/hanzo-tools-runner-resources.tar.gz.pem files-to-r2/ || true
          fi
          ls -la files-to-r2

      - name: Create zip bundle (7z)
        shell: bash
        env:
          ZIP_FILE_NAME: ${{ github.ref_name }}.zip
        run: |
          set -euo pipefail
          cd ./files-to-r2
          7z a -tzip "${ZIP_FILE_NAME}" . -sdel
          cp "${ZIP_FILE_NAME}" latest.zip

      - name: Upload bundle to R2 bucket
        continue-on-error: true
        uses: shallwefootball/s3-upload-action@master
        with:
          endpoint: https://94a3e3f299092abb1feda2a7481ea845.r2.cloudflarestorage.com
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: hanzoai
          source_dir: files-to-r2
          destination_dir: ./hanzo-node/binaries/production/${{ matrix.arch }}/

      - name: Upload bundle to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: files-to-r2/${{ github.ref_name }}.zip
          asset_name: hanzo-node-${{ matrix.arch }}.zip
          tag: ${{ github.ref }}
          overwrite: true

  # ---------------------------------------------------------------------------
  # 3. Docker image -> Docker Hub. Preserved distribution channel. Moved off the
  #    GitHub-hosted ubuntu-latest onto the native amd64 fleet runner to honor the
  #    no-hosted-runners goal (and arc's build/compile-job lint). Build behavior
  #    (multi-stage Dockerfile, tags) is unchanged.
  # ---------------------------------------------------------------------------
  build-docker-image:
    name: Build and push Docker image to Docker Hub
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tools from store to pre-install folder
        run: |
          ./scripts/update_tools.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          build-args: |
            BUILD_TYPE=release
            AI_MODEL_CATALOG_BUILD=1
          tags: |
            hanzoai/hanzo-node:${{ github.ref_name }}
            hanzoai/hanzo-node:release-latest
